# .github/workflows/sync-retroshare.yml
name: Sync RetroShare (manual, no force push)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Where to push RetroShare (owner/repo)"
        required: true
        default: "samuel-asleep/RetroShare"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read monorepo commit title
        id: msg
        run: |
          echo "title=$(git log -1 --pretty=%s $GITHUB_SHA)" >> $GITHUB_OUTPUT

      # -------- Prepare payload (exclude submodules at source) --------
      - name: Prepare RetroShare payload (exclude submodules)
        run: |
          set -e
          rm -rf /tmp/payload
          mkdir -p /tmp/payload

          test -d ./retroshare || (echo "ERROR: ./retroshare not found"; exit 1)
          test -f ./retroshare/.gitmodules || (echo "ERROR: ./retroshare/.gitmodules not found"; exit 1)

          # Read submodule paths from SOURCE (. /retroshare)
          mapfile -t SRC_SUBMODULES < <(
            git config -f ./retroshare/.gitmodules \
              --get-regexp '^submodule\..*\.path$' | awk '{print $2}' || true
          )

          RSYNC_SRC_ARGS=(-a --delete --exclude='/.git' --exclude='/.github' --exclude='/.gitmodules')
          for p in "${SRC_SUBMODULES[@]}"; do
            [ -n "$p" ] || continue
            RSYNC_SRC_ARGS+=( "--exclude=/${p}/" "--exclude=/${p}/**" )
          done

          rsync "${RSYNC_SRC_ARGS[@]}" ./retroshare/ /tmp/payload/

      # -------- Push to target (exclude submodules at destination) --------
      - name: Push to target repo (exclude submodules, no force push)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ secrets.RETROSHARE_TARGET_BRANCH }}
          COMMIT_TITLE: ${{ steps.msg.outputs.title }}
        run: |
          set -e
          test -n "${PUSH_TOKEN}" || (echo "ERROR: PUSH_TOKEN missing"; exit 1)
          test -n "${TARGET_BRANCH}" || (echo "ERROR: RETROSHARE_TARGET_BRANCH missing"; exit 1)

          rm -rf /tmp/target
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/${TARGET_REPO}.git" /tmp/target
          cd /tmp/target

          git config user.name "samuel-asleep"
          git config user.email "benneu40@gmail.com"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${TARGET_BRANCH}"
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -b "${TARGET_BRANCH}"
          fi

          # Read submodule paths from TARGET (.gitmodules)
          if [ -f .gitmodules ]; then
            mapfile -t TGT_SUBMODULES < <(
              git config -f .gitmodules \
                --get-regexp '^submodule\..*\.path$' | awk '{print $2}' || true
            )
          else
            TGT_SUBMODULES=()
          fi

          RSYNC_DST_ARGS=(-a --delete --exclude='/.git' --exclude='/.git/**' --exclude='/.github' --exclude='/.github/**' --exclude='/.gitmodules')
          for p in "${TGT_SUBMODULES[@]}"; do
            [ -n "$p" ] || continue
            RSYNC_DST_ARGS+=( "--exclude=/${p}/" "--exclude=/${p}/**" )
          done

          rsync "${RSYNC_DST_ARGS[@]}" /tmp/payload/ ./

          # Safety check: ensure submodule dirs still exist and are still submodules
          for p in "${TGT_SUBMODULES[@]}"; do
            [ -n "$p" ] || continue
            if [ ! -d "$p" ]; then
              echo "ERROR: submodule directory removed or missing: $p"
              exit 1
            fi
            # Ensure it's still tracked as a submodule (git index check)
            if ! git ls-files --stage "$p" | grep -q "^160000"; then
               echo "ERROR: path $p is no longer a submodule in index"
               exit 1
            fi
          done

          git add -A -- . ':!.gitmodules'
          for p in "${TGT_SUBMODULES[@]}"; do
            [ -n "$p" ] || continue
            git reset "$p"
          done

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "${COMMIT_TITLE}"
          git push origin "${TARGET_BRANCH}"
