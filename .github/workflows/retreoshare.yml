name: Sync RetroShare (manual, no force push)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Where to push RetroShare (owner/repo)"
        required: true
        default: "samuel-asleep/RetroShare"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo (without submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Read monorepo commit title
        id: msg
        run: |
          echo "title=$(git log -1 --pretty=%s $GITHUB_SHA)" >> $GITHUB_OUTPUT

      # ---------------- Prepare payload ----------------
      - name: Prepare RetroShare payload
        run: |
          set -e
          PAYLOAD_DIR="$(mktemp -d)"
          echo "PAYLOAD_DIR=${PAYLOAD_DIR}" >> "$GITHUB_ENV"

          test -d ./retroshare || (echo "ERROR: ./retroshare missing"; exit 1)

          # Simple copy - submodules won't exist since we didn't check them out
          rsync -a \
            --exclude='/.git' \
            --exclude='/.git/**' \
            --exclude='/.github' \
            --exclude='/.github/**' \
            --exclude='/.gitmodules' \
            ./retroshare/ "${PAYLOAD_DIR}/"

      # ---------------- Push to target ----------------
      - name: Push to target repo (preserve submodules)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ secrets.RETROSHARE_TARGET_BRANCH }}
          COMMIT_TITLE: ${{ steps.msg.outputs.title }}
        run: |
          set -e
          test -n "${PUSH_TOKEN}" || (echo "ERROR: PUSH_TOKEN missing"; exit 1)
          test -n "${TARGET_BRANCH}" || (echo "ERROR: RETROSHARE_TARGET_BRANCH missing"; exit 1)

          TARGET_DIR="$(mktemp -d)"
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/${TARGET_REPO}.git" "${TARGET_DIR}"
          cd "${TARGET_DIR}"

          git config user.name "samuel-asleep"
          git config user.email "benneu40@gmail.com"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${TARGET_BRANCH}"
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -b "${TARGET_BRANCH}"
          fi

          # Build exclusion list from target's .gitmodules
          RSYNC_ARGS=(
            -a
            --exclude='/.git'
            --exclude='/.git/**'
            --exclude='/.github'
            --exclude='/.github/**'
            --exclude='/.gitmodules'
          )

          # Read and exclude ALL submodule paths from target repo
          if [ -f .gitmodules ]; then
            echo "Found .gitmodules in target, excluding submodule paths..."
            while IFS= read -r submodule_path; do
              if [ -n "$submodule_path" ]; then
                echo "  Excluding: $submodule_path"
                # Exclude both with and without leading slash for safety
                RSYNC_ARGS+=("--exclude=$submodule_path")
                RSYNC_ARGS+=("--exclude=/$submodule_path")
              fi
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          fi

          # Perform the sync
          rsync "${RSYNC_ARGS[@]}" "${PAYLOAD_DIR}/" ./

          # Verify submodules still exist
          if [ -f .gitmodules ]; then
            echo "Verifying submodules were preserved..."
            while IFS= read -r submodule_path; do
              if [ -n "$submodule_path" ] && [ ! -e "$submodule_path" ]; then
                echo "ERROR: Submodule was deleted: $submodule_path"
                exit 1
              fi
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
            echo "All submodules preserved ✓"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "${COMMIT_TITLE}"
          git push origin "${TARGET_BRANCH}" 
