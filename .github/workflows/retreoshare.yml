name: Sync RetroShare (manual, no force push)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Where to push RetroShare (owner/repo)"
        required: true
        default: "samuel-asleep/RetroShare"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read monorepo commit title
        id: msg
        run: |
          echo "title=$(git log -1 --pretty=%s $GITHUB_SHA)" >> $GITHUB_OUTPUT

      # ---------------- Prepare payload ----------------
      - name: Prepare RetroShare payload (exclude submodules)
        run: |
          set -e
          rm -rf /tmp/payload
          mkdir -p /tmp/payload

          test -d ./retroshare || (echo "ERROR: ./retroshare missing"; exit 1)
          test -f ./retroshare/.gitmodules || (echo "ERROR: ./retroshare/.gitmodules missing"; exit 1)

          # Read submodule paths from SOURCE .gitmodules
          mapfile -t SUBMODULES < <(
            git config -f ./retroshare/.gitmodules \
              --get-regexp '^submodule\..*\.path$' | awk '{print $2}'
          )

          RSYNC_ARGS=(
            -a
            --delete
            --exclude='/.git'
            --exclude='/.github'
            --exclude='/.gitmodules'
          )

          for p in "${SUBMODULES[@]}"; do
            RSYNC_ARGS+=( "--exclude=/${p}/" "--exclude=/${p}/**" )
          done

          rsync "${RSYNC_ARGS[@]}" ./retroshare/ /tmp/payload/

      # ---------------- Push to target ----------------
      - name: Push to target repo (submodules preserved)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ secrets.RETROSHARE_TARGET_BRANCH }}
          COMMIT_TITLE: ${{ steps.msg.outputs.title }}
        run: |
          set -e
          test -n "${PUSH_TOKEN}" || (echo "ERROR: PUSH_TOKEN missing"; exit 1)
          test -n "${TARGET_BRANCH}" || (echo "ERROR: RETROSHARE_TARGET_BRANCH missing"; exit 1)

          rm -rf /tmp/target
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/${TARGET_REPO}.git" /tmp/target
          cd /tmp/target

          git config user.name "samuel-asleep"
          git config user.email "benneu40@gmail.com"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${TARGET_BRANCH}"
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -b "${TARGET_BRANCH}"
          fi

          # Read submodule paths from TARGET .gitmodules
          mapfile -t TARGET_SUBMODULES < <(
            git config -f .gitmodules \
              --get-regexp '^submodule\..*\.path$' | awk '{print $2}'
          )

          RSYNC_APPLY_ARGS=(
            -a
            --delete
            --exclude='/.git'
            --exclude='/.git/**'
            --exclude='/.github'
            --exclude='/.github/**'
            --exclude='/.gitmodules'
          )

          for p in "${TARGET_SUBMODULES[@]}"; do
            RSYNC_APPLY_ARGS+=( "--exclude=/${p}/" "--exclude=/${p}/**" )
          done

          rsync "${RSYNC_APPLY_ARGS[@]}" /tmp/payload/ ./

          # Safety check: submodules must still exist
          for p in "${TARGET_SUBMODULES[@]}"; do
            [ -d "$p" ] || (echo "ERROR: submodule deleted: $p"; exit 1)
          done

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "${COMMIT_TITLE}"
          git push origin "${TARGET_BRANCH}"
