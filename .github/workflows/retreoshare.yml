# .github/workflows/sync-retroshare.yml
name: Sync RetroShare (manual, no force push)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Where to push RetroShare (owner/repo)"
        required: true
        default: "samuel-asleep/RetroShare"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read monorepo commit title
        id: msg
        run: |
          echo "title=$(git log -1 --pretty=%s $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Prepare RetroShare payload (ignore submodules completely)
        run: |
          set -e

          rm -rf /tmp/payload
          mkdir -p /tmp/payload

          test -d ./retroshare || (echo "ERROR: Expected ./retroshare directory not found"; exit 1)
          test -f ./retroshare/.gitmodules || (echo "ERROR: Expected ./retroshare/.gitmodules not found"; exit 1)

          echo "Detecting submodule paths from ./retroshare/.gitmodules..."
          mapfile -t SUBMODULE_PATHS < <(git config -f ./retroshare/.gitmodules --get-regexp path | awk '{print $2}' || true)

          RSYNC_ARGS=(
            -a
            --delete
            --exclude=.git
            --exclude=.github
            --exclude=.gitmodules
          )

          for p in "${SUBMODULE_PATHS[@]}"; do
            [ -n "$p" ] || continue
            # Exclude submodule working tree paths from payload entirely
            RSYNC_ARGS+=( "--exclude=${p}/" )
          done

          echo "Rsyncing ./retroshare -> /tmp/payload (submodules excluded)..."
          rsync "${RSYNC_ARGS[@]}" ./retroshare/ /tmp/payload/

          # Sanity: payload must not include .gitmodules nor submodule dirs
          test ! -f /tmp/payload/.gitmodules || (echo "ERROR: .gitmodules should be excluded but is present in payload"; exit 1)

      - name: Push to target repo (no force push, ignore submodules completely)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ secrets.RETROSHARE_TARGET_BRANCH }}
          COMMIT_TITLE: ${{ steps.msg.outputs.title }}
        run: |
          set -e

          test -n "${PUSH_TOKEN}" || (echo "ERROR: PUSH_TOKEN secret is empty/missing"; exit 1)
          test -n "${TARGET_REPO}" || (echo "ERROR: target_repo input is empty"; exit 1)
          test -n "${TARGET_BRANCH}" || (echo "ERROR: RETROSHARE_TARGET_BRANCH secret is empty/missing"; exit 1)

          rm -rf /tmp/target
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/${TARGET_REPO}.git" /tmp/target
          cd /tmp/target

          echo "PWD: $(pwd)"
          ls -la
          test -d .git || (echo "ERROR: .git not found in $(pwd)"; exit 1)

          git config user.name "samuel-asleep"
          git config user.email "benneu40@gmail.com"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${TARGET_BRANCH}"
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -b "${TARGET_BRANCH}"
          fi

          echo "Detecting submodule paths from target .gitmodules (to protect them)..."
          mapfile -t TARGET_SUBMODULE_PATHS < <(git config -f .gitmodules --get-regexp path | awk '{print $2}' || true)

          # Apply payload safely:
          # - mirror content with --delete
          # - but NEVER touch: .git, .github, .gitmodules, or any submodule directories
          RSYNC_APPLY_ARGS=(
            -a
            --delete
            "--filter=protect .git"
            "--filter=protect .git/**"
            "--filter=protect .github"
            "--filter=protect .github/**"
            "--filter=protect .gitmodules"
          )

          for p in "${TARGET_SUBMODULE_PATHS[@]}"; do
            [ -n "$p" ] || continue
            RSYNC_APPLY_ARGS+=( "--filter=protect ${p}" )
            RSYNC_APPLY_ARGS+=( "--filter=protect ${p}/**" )
          done

          echo "Applying payload (/tmp/payload) -> target repo root (submodules protected)..."
          rsync "${RSYNC_APPLY_ARGS[@]}" /tmp/payload/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "${COMMIT_TITLE}"
          git push origin "${TARGET_BRANCH}" 
